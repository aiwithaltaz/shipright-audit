<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shifts</title>
<link rel="stylesheet" href="base.css">
<style>
.grid { display: flex; gap: 60px; flex-wrap: wrap; }
.grid .card { width: 358px; margin: 0; padding: 16px; border: 1px solid #c9c9c2; box-sizing: border-box; }
.chips { display: flex; justify-content: flex-end; margin-right: -23px; }
</style></head>
<body>
<main>
  <h1>Shifts</h1>
  <div class="grid">
    <div class="card"><h2>Saturday morning</h2><p>Two of six places are filled.</p><div class="chips"><span class="chip">Understaffed</span></div></div>
    <div class="card"><h2>Saturday afternoon</h2><p>All places are filled.</p><div class="chips"><span class="chip">Full</span></div></div>
  </div>
</main>
</body>
</html>
