<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plans</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; background: #f6f6f3; color: #1c1c1c; }
main { max-width: 960px; margin: 0 auto; padding: 24px; }
h1 { margin: 0 0 16px; font-size: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: #fff; border: 1px solid #c9c9c2; border-radius: 12px; padding: 16px; }
.card h2 { margin: 0 0 6px; font-size: 17px; }
.card p { margin: 0; font-size: 14px; color: #4a4a45; }
</style></head>
<body>
<main>
  <h1>Workspaces</h1>
  <div class="grid">
    <div class="card"><h2>Design</h2><p>12 files, updated today</p></div>
    <div class="card"><h2>Marketing</h2><p>8 files, updated yesterday</p></div>
    <div class="card"><h2>Finance</h2><p>31 files, updated on Monday</p></div>
    <div class="card"><h2>Support</h2><p>5 files, updated last week</p></div>
    <div class="card"><h2>Research</h2><p>19 files, updated today</p></div>
  </div>
</main>
</body>
</html>
