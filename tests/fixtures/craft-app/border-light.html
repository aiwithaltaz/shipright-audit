<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #1c1c1c; }
main { max-width: 560px; margin: 40px auto; padding: 24px; }
label { display: block; margin-bottom: 14px; font-size: 14px; }
input, select { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid #dde1e8; border-radius: 8px; background: #fff; font: inherit; }
.ghost { padding: 10px 16px; border: 1px solid #dde1e8; border-radius: 8px; background: #fff; font: inherit; }
</style></head>
<body>
<main>
  <h1>Contact</h1>
  <label>Your email <input type="email" value="sam@example.com"></label>
  <label>Topic <select><option>Billing</option><option>Other</option></select></label>
  <button class="ghost" type="button">Cancel</button>
</main>
</body>
</html>
