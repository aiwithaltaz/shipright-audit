<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New invoice</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; background: #1b1c1a; color: #ecece8; }
main { max-width: 560px; margin: 40px auto; padding: 24px; background: #2a2c29; border-radius: 12px; }
h1 { margin: 0 0 16px; font-size: 22px; }
label { display: block; margin-bottom: 14px; font-size: 14px; }
.field { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 8px; color: #ecece8; font: inherit; background: #2a2c29; border: 1px solid #333533; }
.ghost { padding: 10px 16px; margin-left: 8px; border: 1px solid #333533; border-radius: 8px; background: transparent; color: #ecece8; font: inherit; }
.go { padding: 10px 16px; border: 0; border-radius: 8px; background: #d7f26b; color: #1b1c1a; font: inherit; }
</style></head>
<body>
<main>
  <h1>New invoice</h1>
  <label>Client name <input class="field" type="text" value="North Studio"></label>
  <label>Currency <select class="field"><option>EUR</option><option>USD</option></select></label>
  <button class="go" type="button">Create invoice</button><button class="ghost" type="button">Cancel</button>
</main>
</body>
</html>
