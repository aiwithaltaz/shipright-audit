<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notes</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; color: #1c1c1c; }
main { max-width: 720px; margin: 0 auto; padding: 24px; }
[role=tablist] { display: flex; gap: 8px; margin-bottom: 16px; }
[role=tab] { padding: 8px 14px; border: 1px solid #777; border-radius: 8px; background: #fff; font: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; justify-content: space-between; border: 1px solid #c9c9c9; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
.star { width: 36px; height: 36px; border: 1px solid #777; border-radius: 8px; background: #fff; color: #333; }
.star svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.star[aria-pressed="true"] svg { fill: currentColor; }
</style></head>
<body>
<main>
  <h1>Notes</h1>
  <div role="tablist" aria-label="Show"><button type="button" role="tab" aria-selected="true">All</button><button type="button" role="tab" aria-selected="false">Recent</button></div>
  <ul>
    <li><span>Shopping list</span><button type="button" class="star" aria-pressed="false" title="Star"><svg viewBox="0 0 24 24"><path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.8 6.1 21l1.2-6.5L2.5 9.9 9.1 9z"/></svg></button></li><li><span>Trip ideas</span><button type="button" class="star" aria-pressed="false" title="Star"><svg viewBox="0 0 24 24"><path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.8 6.1 21l1.2-6.5L2.5 9.9 9.1 9z"/></svg></button></li><li><span>Meeting notes</span><button type="button" class="star" aria-pressed="false" title="Star"><svg viewBox="0 0 24 24"><path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.8 6.1 21l1.2-6.5L2.5 9.9 9.1 9z"/></svg></button></li><li><span>Book quotes</span><button type="button" class="star" aria-pressed="false" title="Star"><svg viewBox="0 0 24 24"><path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.8 6.1 21l1.2-6.5L2.5 9.9 9.1 9z"/></svg></button></li>
  </ul>
</main>
<script>
  document.querySelectorAll('.star').forEach(b => b.onclick = () => { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); fetch('/api/star', { method: 'POST' }).catch(() => {}); });
</script>
</body>
</html>
