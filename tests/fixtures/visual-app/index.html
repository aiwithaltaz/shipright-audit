<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Box (test fixture)</title>
<!-- Dev-only fixture for the visual.mjs tests. Planted problems are marked PLANT. Never used in the benchmark. -->
<style>
  :root { --r: 12px; --line: #dcdcdc; --ink: #1b1b1b; --muted: #555; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; color: var(--ink); background: #fafafa; }
  nav { display: flex; gap: 16px; padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--line); align-items: center; }
  nav a { color: var(--ink); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  .count { background: #eee; border-radius: 999px; padding: 0 8px; font-size: 12px; }
  .account { margin-left: auto; position: relative; }
  .account button { border: 1px solid var(--line); background: #fff; border-radius: var(--r); padding: 8px 12px; cursor: pointer; }
  /* PLANT: sharp-cornered menu among rounded surfaces */
  .menu { display: none; position: fixed; left: 24px; bottom: 40px; width: 220px; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.15); border-radius: 0; z-index: 10; padding: 8px; }
  .menu.open { display: block; }
  .menu a { display: block; padding: 10px; color: var(--ink); text-decoration: none; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; padding-bottom: 160px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 8px; font-size: 17px; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .meta { display: flex; justify-content: space-between; align-items: center; }
  .date { color: var(--muted); font-size: 13px; }
  .btn { border: 0; background: #1b1b1b; color: #fff; border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pill { background: #e7eefc; color: #1d3f8f; border-radius: 999px; padding: 2px 10px; font-size: 12px; height: 22px; line-height: 18px; white-space: nowrap; }
  /* PLANT: one card's date is pushed right, so dates do not line up across the row */
  .card.odd .date { padding-left: 18px; }
  /* PLANT: a big empty gap above the footer of every card in the second group */
  .list .card p { margin-bottom: 84px; }
  .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 32px; }
  /* PLANT: fixed composer that sits on top of the menu */
  .composer { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; background: #fff; border-top: 1px solid var(--line); z-index: 50; padding: 16px 24px; }
  .composer textarea { width: 100%; height: 80px; border: 1px solid var(--line); border-radius: var(--r); padding: 10px; font: inherit; }
</style>
</head>
<body>
<nav aria-label="Main">
  <a href="#/">Recipes <span class="count">3</span></a>
  <!-- PLANT: the count says 12 but the Saved page is empty -->
  <a href="#/saved">Saved <span class="count">12</span></a>
  <div class="account">
    <button aria-haspopup="menu" aria-expanded="false" id="acct">Account</button>
    <div class="menu" role="menu" id="menu"><a role="menuitem" href="#/">Profile</a><a role="menuitem" href="#/">Settings</a></div>
  </div>
</nav>
<main id="app"></main>
<div class="composer"><textarea aria-label="New recipe idea" placeholder="Describe a recipe idea"></textarea></div>
<script>
  const app = document.getElementById('app');
  const card = (t, d, odd, pills) => `<article class="card${odd ? ' odd' : ''}"><h3>${t}</h3>${pills ? `<div class="pills">${pills.map(p => `<span class="pill">${p}</span>`).join('')}</div>` : ''}<p>A quick weeknight dish with pantry staples.</p><div class="meta"><span class="date">${d}</span><button class="btn">Open</button></div></article>`;
  function render() {
    if (location.hash === '#/saved') { app.innerHTML = '<h1>Saved</h1><p>No saved recipes yet. Save one from Recipes.</p>'; return; }
    app.innerHTML = '<h1>Recipes</h1><section class="grid">'
      + card('Lemon pasta', 'Oct 12, 2026', false, ['Quick', 'Vegetarian'])
      // PLANT: a sentence used as a pill, and a card crowded with pills
      + card('Tomato soup', 'Oct 10, 2026', true, ['This recipe was generated from your saved notes last week'])
      + card('Fried rice', 'Oct 8, 2026', false, ['Quick', 'Rice', 'Spicy', 'Leftovers', 'Wok', 'Dinner'])
      + '</section><section class="list">' + card('Bean chili', 'Sep 30, 2026') + card('Pancakes', 'Sep 28, 2026') + '</section>';
  }
  const acct = document.getElementById('acct'), menu = document.getElementById('menu');
  acct.addEventListener('click', () => { const open = menu.classList.toggle('open'); acct.setAttribute('aria-expanded', String(open)); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { menu.classList.remove('open'); acct.setAttribute('aria-expanded', 'false'); } });
  addEventListener('hashchange', render); render();
</script>
</body>
</html>
