<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; color: #1c1c1c; background: #f4f4f1; }
main { max-width: 380px; margin: 64px auto; padding: 28px; background: #fff; border: 1px solid #8a8a84; border-radius: 12px; }
h1 { margin: 0 0 20px; font-size: 22px; }
.f { position: relative; margin-bottom: 16px; }
.f input { display: block; width: 100%; height: 52px; padding: 20px 12px 6px; border: 1px solid #6b6b66; border-radius: 8px; font: inherit; background: #fff; }
.f label { position: absolute; left: 12px; top: 16px; color: #55554f; font-size: 16px; pointer-events: none; transition: all .12s; }
.f input:not(:placeholder-shown) + label { opacity: 0; }
button { width: 100%; height: 44px; border: 0; border-radius: 8px; background: #1a56db; color: #fff; font: inherit; }
</style></head>
<body>
<main>
  <h1>Sign in</h1>
  <form id="f">
    <div class="f"><input id="email" type="email" placeholder=" " autocomplete="off"><label for="email">Email address</label></div>
    <div class="f"><input id="pw" type="password" placeholder=" " autocomplete="off"><label for="pw">Password</label></div>
    <button type="submit">Continue</button>
  </form>
</main>
<script>
  const tell = what => fetch('/api/' + what, { method: 'POST' }).catch(() => {});
  document.getElementById('f').onsubmit = e => { e.preventDefault(); tell('submit'); };
  document.querySelectorAll('input').forEach(i => i.addEventListener('input', () => tell('typed=' + i.type + ':' + i.value.length)));
</script>
</body>
</html>
